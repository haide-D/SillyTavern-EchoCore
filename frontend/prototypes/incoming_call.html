<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Patronus UI — Incoming Call</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="incoming_call.css">
</head>

<body>

    <div class="title-watermark">Patronus UI — Incoming Call</div>

    <!-- ====== 背景粒子 Canvas（base.js 用）====== -->
    <canvas id="particleCanvas"></canvas>

    <!-- ====== 死亡圣器符文（待机态触发器）====== -->
    <div class="proto-element dh-container" id="dhContainer">
        <div class="dh-inner" id="dhInner">
            <div class="dh-glow"></div>

            <svg class="dh-svg" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- 轨道环 -->
                <circle class="dh-orbit-outer" cx="28" cy="28" r="26" />
                <circle class="dh-orbit-mid" cx="28" cy="28" r="23" />

                <!-- 符文标记环 -->
                <g class="dh-rune-ring">
                    <circle cx="28" cy="28" r="27" fill="none" stroke="rgba(var(--dh-gold-rgb), 0.12)"
                        stroke-width="0.3" />
                    <path class="rune-glyph" d="M28,1 L28,5 M26,2.5 L28,1 L30,2.5" />
                    <path class="rune-glyph" d="M46,8 L48,10 L46,12 L44,10 Z" />
                    <path class="rune-glyph" d="M53,27 L55,29 M55,27 L53,29" />
                    <circle class="rune-dot" cx="54" cy="28" r="0.6" />
                    <path class="rune-glyph" d="M46,46 L48,43 L50,46" />
                    <path class="rune-glyph" d="M27,51 L27,55 M29,51 L29,55" />
                    <circle class="rune-dot" cx="28" cy="53" r="0.6" />
                    <path class="rune-glyph" d="M10,46 L8,43 L10,43 M8,46 L8,43" />
                    <path class="rune-glyph" d="M1,27 L4,27 L1,29 L4,29" />
                    <circle class="rune-dot" cx="2.5" cy="28" r="0.6" />
                    <path class="rune-glyph" d="M8,12 L10,9 L12,12" />
                    <circle class="rune-dot" cx="10" cy="10" r="0.6" />
                </g>

                <!-- 死亡圣器标志 -->
                <path class="dh-triangle" d="M28,10 L42,44 L14,44 Z" />
                <path class="dh-triangle-flow" d="M28,10 L42,44 L14,44 Z" />
                <circle class="dh-circle" cx="28" cy="32" r="10.5" />
                <circle class="dh-circle-flow" cx="28" cy="32" r="10.5" />
                <line class="dh-line" x1="28" y1="10" x2="28" y2="44" />
                <line class="dh-line-flow" x1="28" y1="10" x2="28" y2="44" />

                <!-- 核心光点 -->
                <circle class="dh-core" cx="28" cy="28" r="2" />
                <circle class="dh-node" cx="28" cy="10" r="1.2">
                    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite" />
                </circle>
                <circle class="dh-node" cx="42" cy="44" r="1">
                    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite" />
                </circle>
                <circle class="dh-node" cx="14" cy="44" r="1">
                    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite" />
                </circle>
            </svg>

            <div class="dh-shadow"></div>
        </div>
    </div>

    <!-- ====== 全屏覆盖层 ====== -->
    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <!-- 银色薄雾 -->
        <div class="silver-mist" id="silverMist"></div>
        <!-- 守护神粒子 Canvas -->
        <canvas id="patronusCanvas"></canvas>
    </div>

    <!-- ====== 来电信息 UI ====== -->
    <div class="call-info" id="callInfo">
        <div class="caller-name" id="callerNameText"></div>
        <div class="caller-subtitle" id="callerSub"></div>
        <div class="call-buttons" id="callButtons">
            <button class="call-btn accept" onclick="acceptCall()">Accio ✨</button>
            <button class="call-btn decline" onclick="declineCall()">Silencio 🤫</button>
        </div>
    </div>

    <!-- ====== 冥想盆（通话中）====== -->
    <div class="pensieve-container" id="pensieveContainer">
        <div class="pensieve-bowl">
            <div class="pensieve-ripple"></div>
            <div class="pensieve-ripple"></div>
            <div class="pensieve-ripple"></div>
            <div class="pensieve-surface"></div>
        </div>
    </div>

    <!-- ====== 字幕区 ====== -->
    <div class="subtitle-area" id="subtitleArea">
        <div class="subtitle-text" id="subtitleText"></div>
    </div>

    <!-- ====== Debug ====== -->
    <div class="debug-info" id="debugInfo">FPS: --</div>

    <div class="debug-bar">
        <button class="debug-btn active" id="btnIdle" onclick="resetAll()">⚡ 待机</button>
        <button class="debug-btn" id="btnCall" onclick="triggerIncomingCall()">🦌 来电触发</button>
        <button class="debug-btn" id="btnActive" onclick="jumpToActive()">📞 通话中</button>
        <button class="debug-btn" id="btnEnd" onclick="endCall()">🔚 结束</button>
        <button class="debug-btn" id="btnReset" onclick="resetAll()">↻ 重置</button>
    </div>

    <!-- ====== 脚本 ====== -->
    <script src="base.js"></script>
    <script src="incoming_call.js"></script>

    <script>
        // 初始化 base.js 的粒子系统（待机态符文漂浮）
        const dhInner = document.getElementById('dhInner');
        const dhContainer = document.getElementById('dhContainer');

        const proto = new PrototypeBase({
            elementId: 'dhContainer',
            elementSize: 72,
            colors: {
                dustRGB: '200, 180, 120',
                dustGlowRGB: '212, 168, 83',
                trailHue: [38, 52], trailSat: 55, trailLight: 70,
                whisperHue: [265, 285], whisperSat: 60, whisperLight: 55,
                goldHue: [40, 50], goldSat: 70, goldLight: 68,
            },
            float: { baseX: 0.78, baseY: 0.50 },
            particles: {
                trailMaxParticles: 10, trailEmitChance: 0.08,
                trailLifespan: 3500, ambientParticles: 5,
            },
            emitters: {
                svgViewBox: 56,
                edges: [
                    { from: [28, 10], to: [42, 44] },
                    { from: [42, 44], to: [14, 44] },
                    { from: [14, 44], to: [28, 10] },
                ],
                arcs: [{ cx: 28, cy: 32, r: 10.5 }],
                vertices: [
                    [28, 10], [42, 44], [14, 44],
                    [21.5, 40], [34.5, 40], [28, 28],
                ],
            },
            microEvents: [
                {
                    name: 'surge', weight: 50,
                    fn(done, p) {
                        p.burstParticles(3, 'gold');
                        for (let i = 0; i < 2; i++) p._emitOrbitParticle('gold');
                        setTimeout(done, 800);
                    }
                },
            ],
            onEnterState() { },
            onLeaveState() { },
        });
        proto.start();

        // 全局 switchState 兼容 debug bar
        window.switchState = function (state) {
            if (state === 'idle' || state === 'reset') resetAll();
        };
    </script>

</body>

</html>
