version: '3.8'

services:
  st-direct-tts:
    build: .
    container_name: st-direct-tts-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # 持久化用户数据（SQLite 记忆、剧情指纹、头像等）
      - ./data:/app/data
      # 持久化音频缓存
      - ./Cache:/app/Cache
    environment:
      - PYTHONUNBUFFERED=1
