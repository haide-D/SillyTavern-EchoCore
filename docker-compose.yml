version: '3.8'

services:
  st-direct-tts:
    build: .
    container_name: st-direct-tts-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # 持久化用户数据（SQLite 记忆、剧情指纹、头像等）
      - ./data:/app/data
      # 持久化音频缓存
      - ./Cache:/app/Cache
      # 配置文件持久化
      - ./system_settings.json:/app/system_settings.json
      - ./character_mappings.json:/app/character_mappings.json
    environment:
      - PYTHONUNBUFFERED=1
